<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DollarPunk News Ingestion Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body class="gradient-bg min-h-screen text-white">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold mb-2">📊 DollarPunk News Ingestion</h1>
            <p class="text-xl opacity-80">Real-time monitoring dashboard</p>
        </div>

        <!-- Control Panel -->
        <div class="card rounded-lg p-6 mb-8">
            <h2 class="text-2xl font-bold mb-4">🎮 Control Panel</h2>
            <div class="flex flex-wrap gap-4 items-center">
                <button id="startBtn" class="bg-green-500 hover:bg-green-600 px-6 py-3 rounded-lg font-semibold transition-colors">
                    ▶️ Start Ingestion
                </button>
                <button id="stopBtn" class="bg-red-500 hover:bg-red-600 px-6 py-3 rounded-lg font-semibold transition-colors">
                    ⏹️ Stop Ingestion
                </button>
                <button id="debugBtn" class="bg-yellow-500 hover:bg-yellow-600 px-6 py-3 rounded-lg font-semibold transition-colors">
                    🔍 Debug Info
                </button>
                <div id="statusIndicator" class="flex items-center gap-2">
                    <div id="statusDot" class="w-3 h-3 rounded-full bg-gray-400"></div>
                    <span id="statusText">Stopped</span>
                </div>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <!-- Total Articles -->
            <div class="card rounded-lg p-6 text-center">
                <div class="text-3xl font-bold mb-2" id="totalArticles">0</div>
                <div class="text-sm opacity-80">Total Articles</div>
            </div>
            
            <!-- Docker Status -->
            <div class="card rounded-lg p-6 text-center">
                <div class="text-3xl font-bold mb-2" id="dockerStatus">❌</div>
                <div class="text-sm opacity-80">Docker Status</div>
            </div>
            
            <!-- Progress -->
            <div class="card rounded-lg p-6 text-center">
                <div class="text-3xl font-bold mb-2" id="progress">0%</div>
                <div class="text-sm opacity-80">Progress</div>
            </div>
            
            <!-- Current Ticker -->
            <div class="card rounded-lg p-6 text-center">
                <div class="text-3xl font-bold mb-2" id="currentTicker">-</div>
                <div class="text-sm opacity-80">Current Ticker</div>
            </div>
        </div>

        <!-- Charts Row -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <!-- Articles per Ticker -->
            <div class="card rounded-lg p-6">
                <h3 class="text-xl font-bold mb-4">📈 Articles per Ticker</h3>
                <canvas id="tickerChart" width="400" height="200"></canvas>
            </div>
            
            <!-- Sentiment Distribution -->
            <div class="card rounded-lg p-6">
                <h3 class="text-xl font-bold mb-4">😊 Sentiment Distribution</h3>
                <canvas id="sentimentChart" width="400" height="200"></canvas>
            </div>
        </div>

        <!-- Latest Articles -->
        <div class="card rounded-lg p-6 mb-8">
            <h3 class="text-xl font-bold mb-4">📰 Latest Articles</h3>
            <div id="latestArticles" class="space-y-4">
                <!-- Articles will be populated here -->
            </div>
        </div>

        <!-- Logs -->
        <div class="card rounded-lg p-6">
            <h3 class="text-xl font-bold mb-4">📋 Live Logs</h3>
            <div id="logsContainer" class="bg-black bg-opacity-50 rounded-lg p-4 h-64 overflow-y-auto font-mono text-sm">
                <div id="logs">Loading logs...</div>
            </div>
        </div>
    </div>

    <script>
        let tickerChart, sentimentChart;
        
        // Initialize charts
        function initCharts() {
            const tickerCtx = document.getElementById('tickerChart').getContext('2d');
            tickerChart = new Chart(tickerCtx, {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Articles',
                        data: [],
                        backgroundColor: 'rgba(102, 126, 234, 0.8)',
                        borderColor: 'rgba(102, 126, 234, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { color: 'white' }
                        },
                        x: {
                            ticks: { color: 'white' }
                        }
                    },
                    plugins: {
                        legend: {
                            labels: { color: 'white' }
                        }
                    }
                }
            });

            const sentimentCtx = document.getElementById('sentimentChart').getContext('2d');
            sentimentChart = new Chart(sentimentCtx, {
                type: 'doughnut',
                data: {
                    labels: [],
                    datasets: [{
                        data: [],
                        backgroundColor: [
                            'rgba(34, 197, 94, 0.8)',
                            'rgba(59, 130, 246, 0.8)',
                            'rgba(156, 163, 175, 0.8)',
                            'rgba(239, 68, 68, 0.8)',
                            'rgba(168, 85, 247, 0.8)'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { color: 'white' }
                        }
                    }
                }
            });
        }

        // Update dashboard
        function updateDashboard() {
            fetch('/api/stats')
                .then(response => response.json())
                .then(data => {
                    // Update stats
                    document.getElementById('totalArticles').textContent = data.news_stats.total_articles;
                    document.getElementById('dockerStatus').textContent = data.docker_status ? '✅' : '❌';
                    document.getElementById('progress').textContent = data.ingestion_status.progress + '%';
                    document.getElementById('currentTicker').textContent = data.ingestion_status.current_ticker || '-';
                    
                    // Update status
                    const statusDot = document.getElementById('statusDot');
                    const statusText = document.getElementById('statusText');
                    if (data.ingestion_status.is_running) {
                        statusDot.className = 'w-3 h-3 rounded-full bg-green-400 pulse';
                        statusText.textContent = 'Running';
                    } else {
                        statusDot.className = 'w-3 h-3 rounded-full bg-gray-400';
                        statusText.textContent = 'Stopped';
                    }
                    
                    // Update charts
                    updateCharts(data.news_stats);
                    
                    // Update latest articles
                    updateLatestArticles(data.news_stats.latest_articles);
                })
                .catch(error => console.error('Error fetching stats:', error));
        }

        // Update charts
        function updateCharts(stats) {
            // Update ticker chart
            tickerChart.data.labels = Object.keys(stats.tickers);
            tickerChart.data.datasets[0].data = Object.values(stats.tickers);
            tickerChart.update();
            
            // Update sentiment chart
            sentimentChart.data.labels = Object.keys(stats.sentiment_distribution);
            sentimentChart.data.datasets[0].data = Object.values(stats.sentiment_distribution);
            sentimentChart.update();
        }

        // Update latest articles
        function updateLatestArticles(articles) {
            const container = document.getElementById('latestArticles');
            container.innerHTML = articles.map(article => `
                <div class="border-b border-gray-600 pb-4 last:border-b-0">
                    <div class="font-semibold text-blue-300">${article.title}</div>
                    <div class="text-sm opacity-80 mt-1">${article.summary}</div>
                    <div class="flex gap-4 mt-2 text-xs">
                        <span class="bg-blue-500 px-2 py-1 rounded">${article.source_ticker}</span>
                        <span class="bg-green-500 px-2 py-1 rounded">${article.overall_sentiment_label}</span>
                        <span class="opacity-60">${article.source}</span>
                    </div>
                </div>
            `).join('');
        }

        // Update logs
        function updateLogs() {
            fetch('/api/logs')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('logs').textContent = data.logs || 'No logs available';
                })
                .catch(error => console.error('Error fetching logs:', error));
        }

        // Control buttons
        document.getElementById('startBtn').addEventListener('click', () => {
            fetch('/api/start_ingestion', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        alert('Error: ' + data.error);
                    } else {
                        console.log('Ingestion started');
                    }
                });
        });

        document.getElementById('stopBtn').addEventListener('click', () => {
            fetch('/api/stop_ingestion', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        alert('Error: ' + data.error);
                    } else {
                        console.log('Ingestion stopped');
                    }
                });
        });

        document.getElementById('debugBtn').addEventListener('click', () => {
            fetch('/api/debug')
                .then(response => response.json())
                .then(data => {
                    console.log('Debug info:', data);
                    alert('Debug info logged to console. Check browser console for details.');
                });
        });

        // Initialize and start updates
        initCharts();
        updateDashboard();
        updateLogs();
        
        // Update every 5 seconds
        setInterval(updateDashboard, 5000);
        setInterval(updateLogs, 10000);
    </script>
</body>
</html>
