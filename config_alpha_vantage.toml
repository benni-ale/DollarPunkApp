[data_collection]
mode = "prod"  # Usa dati reali da Alpha Vantage

[[data_collection.sources]]
name = "Alpha Vantage News"
platform = "alphavantage"
url = "https://www.alphavantage.co/query"
api_key = ""  # API key verrà caricata dal file .env o specificata via parametro
enabled = true

[data_collection.collection_period]
start_date = "2025-01-01T00:00:00Z"
end_date = "2025-12-31T23:59:59Z"
interval_hours = 24

[data_collection.filters]
keywords = [
    "finance",
    "economy", 
    "crypto",
    "stocks",
    "earnings",
    "fed",
    "inflation",
    "bitcoin",
    "ethereum",
    "market",
    "trading"
]
languages = ["en"]
min_engagement = 10
exclude_retweets = true
exclude_ads = true

[stratification]
min_samples_per_stratum = 10
max_samples_per_stratum = 100

[stratification.platform_weights]
alphavantage = 1.5
newswebsite = 1.0
rss = 1.0
twitter = 1.0

[stratification.theme_weights]
economy = 1.5
technology = 1.0
politics = 0.8
other = 0.5 