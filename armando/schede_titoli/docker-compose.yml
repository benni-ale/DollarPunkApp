version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ../../.env:/app/.env:ro
    environment:
      - ALPHAVANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY}
    restart: unless-stopped
    networks:
      - schede-network

  frontend:
    build: ./frontend
    ports:
      - "3001:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - schede-network

networks:
  schede-network:
    driver: bridge
