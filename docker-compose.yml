version: '3.8'

services:
  dollarpunk-ingest:
    build: .
    volumes:
      - ./output:/app/output
      - ./.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  dollarpunk-dashboard:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./output:/app/output
      - ./.env:/app/.env:ro
      - ./templates:/app/templates
    environment:
      - PYTHONUNBUFFERED=1
    command: python app.py
    depends_on:
      - dollarpunk-ingest 