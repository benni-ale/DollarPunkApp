version: '3.8'

services:
  dollarpunk-ingest:
    build: ./ingestion
    volumes:
      - ./output:/app/output
      - ./.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
      - INGESTION_MODE=2  # Default to historical year ingestion
    networks:
      - dollarpunk-network

  dollarpunk-process:
    build: ./processing
    volumes:
      - ./output:/app/output
    depends_on:
      - dollarpunk-ingest
    networks:
      - dollarpunk-network

  dollarpunk-bi:
    build: ./bi
    ports:
      - "8501:8501"
    volumes:
      - ./output:/app/data
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    depends_on:
      - dollarpunk-process
    restart: unless-stopped
    networks:
      - dollarpunk-network

networks:
  dollarpunk-network:
    driver: bridge 