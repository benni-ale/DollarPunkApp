<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DollarPunk News Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .calendar-day {
            transition: all 0.2s;
        }
        .calendar-day:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }
        .calendar-day.has-news {
            background: rgba(34, 197, 94, 0.3);
        }
        .news-item {
            transition: all 0.2s;
        }
        .news-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="gradient-bg min-h-screen text-white">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold mb-2">📊 DollarPunk News Dashboard</h1>
            <p class="text-xl opacity-80">Real-time news sentiment analysis</p>
        </div>

        <!-- Stats Overview -->
        <div class="card rounded-lg p-6 mb-8">
            <h2 class="text-2xl font-bold mb-4">📈 Overview</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="text-center">
                    <div class="text-3xl font-bold" id="totalArticles">-</div>
                    <div class="text-sm opacity-80">Total Articles</div>
                </div>
                <div class="text-center">
                    <div class="text-3xl font-bold" id="uniqueUrls">-</div>
                    <div class="text-sm opacity-80">Unique URLs</div>
                </div>
                <div class="text-center">
                    <div class="text-3xl font-bold" id="duplicateRate">-</div>
                    <div class="text-sm opacity-80">Duplicate Rate</div>
                </div>
                <div class="text-center">
                    <div class="text-3xl font-bold" id="dateRange">-</div>
                    <div class="text-sm opacity-80">Date Range</div>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="card rounded-lg p-6 mb-8">
            <h2 class="text-2xl font-bold mb-4">🔍 Filters</h2>
            <div class="flex flex-wrap gap-4 items-center">
                <div>
                    <label class="block text-sm font-bold mb-2">Ticker:</label>
                    <select id="tickerFilter" class="bg-black bg-opacity-50 text-white px-4 py-2 rounded-lg">
                        <option value="">All Tickers</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold mb-2">Sentiment:</label>
                    <select id="sentimentFilter" class="bg-black bg-opacity-50 text-white px-4 py-2 rounded-lg">
                        <option value="">All Sentiments</option>
                        <option value="Bullish">Bullish</option>
                        <option value="Somewhat-Bullish">Somewhat-Bullish</option>
                        <option value="Neutral">Neutral</option>
                        <option value="Somewhat-Bearish">Somewhat-Bearish</option>
                        <option value="Bearish">Bearish</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold mb-2">Source:</label>
                    <select id="sourceFilter" class="bg-black bg-opacity-50 text-white px-4 py-2 rounded-lg">
                        <option value="">All Sources</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold mb-2">Date:</label>
                    <input type="date" id="dateFilter" class="bg-black bg-opacity-50 text-white px-4 py-2 rounded-lg">
                </div>
                <button id="clearFilters" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg font-semibold transition-colors">
                    🗑️ Clear Filters
                </button>
            </div>
        </div>

        <!-- Calendar View -->
        <div class="card rounded-lg p-6 mb-8">
            <h2 class="text-2xl font-bold mb-4">📅 News Calendar</h2>
            <div id="calendar" class="grid grid-cols-7 gap-2">
                <!-- Calendar will be populated here -->
            </div>
        </div>

        <!-- Charts -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <div class="card rounded-lg p-6">
                <h3 class="text-xl font-bold mb-4">📈 Articles by Ticker</h3>
                <canvas id="tickerChart" width="400" height="200"></canvas>
            </div>
            <div class="card rounded-lg p-6">
                <h3 class="text-xl font-bold mb-4">😊 Sentiment Distribution</h3>
                <canvas id="sentimentChart" width="400" height="200"></canvas>
            </div>
        </div>

        <!-- News List -->
        <div class="card rounded-lg p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold">📰 News Articles</h2>
                <div class="text-sm opacity-80">
                    Showing <span id="showingCount">0</span> of <span id="totalCount">0</span> articles
                </div>
            </div>
            <div id="newsList" class="space-y-4 max-h-96 overflow-y-auto">
                <!-- News items will be populated here -->
            </div>
        </div>
    </div>

    <script>
        let allArticles = [];
        let filteredArticles = [];
        let tickerChart, sentimentChart;

        // Initialize charts
        function initCharts() {
            const tickerCtx = document.getElementById('tickerChart').getContext('2d');
            tickerChart = new Chart(tickerCtx, {
                type: 'bar',
                data: { labels: [], datasets: [{ label: 'Articles', data: [], backgroundColor: 'rgba(102, 126, 234, 0.8)' }] },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { color: 'white' } }, x: { ticks: { color: 'white' } } }, plugins: { legend: { labels: { color: 'white' } } } }
            });

            const sentimentCtx = document.getElementById('sentimentChart').getContext('2d');
            sentimentChart = new Chart(sentimentCtx, {
                type: 'doughnut',
                data: { labels: [], datasets: [{ data: [], backgroundColor: ['rgba(34, 197, 94, 0.8)', 'rgba(59, 130, 246, 0.8)', 'rgba(156, 163, 175, 0.8)', 'rgba(239, 68, 68, 0.8)', 'rgba(168, 85, 247, 0.8)'] }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: 'white' } } } }
            });
        }

        // Load and parse all JSON files
        async function loadAllData() {
            try {
                // Find all JSON files
                const response = await fetch('output/');
                const text = await response.text();
                const files = text.match(/news_data_[^"]*\.json/g) || [];
                
                allArticles = [];
                const allUrls = new Set();
                
                for (const file of files) {
                    try {
                        const fileResponse = await fetch(`output/${file}`);
                        const articles = await fileResponse.json();
                        articles.forEach(article => {
                            if (article.url && !allUrls.has(article.url)) {
                                allUrls.add(article.url);
                                allArticles.push(article);
                            }
                        });
                    } catch (e) {
                        console.warn(`Error loading ${file}:`, e);
                    }
                }
                
                console.log(`Loaded ${allArticles.length} unique articles from ${files.length} files`);
                updateDashboard();
            } catch (error) {
                console.error('Error loading data:', error);
                // Fallback: try to load analysis_results.json if it exists
                try {
                    const response = await fetch('output/analysis_results.json');
                    const data = await response.json();
                    allArticles = data.all_articles || [];
                    updateDashboard();
                } catch (e) {
                    console.error('No data available');
                    document.body.innerHTML = '<div class="text-center p-8"><h1 class="text-2xl">No data found</h1><p>Run the ingestion first to see data</p></div>';
                }
            }
        }

        // Update dashboard with current data
        function updateDashboard() {
            updateOverview();
            updateFilters();
            updateCalendar();
            updateCharts();
            updateNewsList();
        }

        // Update overview stats
        function updateOverview() {
            const totalArticles = allArticles.length;
            const uniqueUrls = new Set(allArticles.map(a => a.url)).size;
            const duplicateRate = totalArticles > 0 ? ((totalArticles - uniqueUrls) / totalArticles * 100).toFixed(1) : 0;
            
            const dates = allArticles.map(a => a.time_published?.substring(0, 8)).filter(Boolean);
            const dateRange = dates.length > 0 ? `${dates[0]} to ${dates[dates.length - 1]}` : 'N/A';
            
            document.getElementById('totalArticles').textContent = totalArticles;
            document.getElementById('uniqueUrls').textContent = uniqueUrls;
            document.getElementById('duplicateRate').textContent = duplicateRate + '%';
            document.getElementById('dateRange').textContent = dateRange;
        }

        // Update filter options
        function updateFilters() {
            const tickers = [...new Set(allArticles.map(a => a.source_ticker))].sort();
            const sources = [...new Set(allArticles.map(a => a.source))].sort();
            
            const tickerSelect = document.getElementById('tickerFilter');
            const sourceSelect = document.getElementById('sourceFilter');
            
            tickerSelect.innerHTML = '<option value="">All Tickers</option>';
            tickers.forEach(ticker => {
                tickerSelect.innerHTML += `<option value="${ticker}">${ticker}</option>`;
            });
            
            sourceSelect.innerHTML = '<option value="">All Sources</option>';
            sources.forEach(source => {
                sourceSelect.innerHTML += `<option value="${source}">${source}</option>`;
            });
        }

        // Update calendar view
        function updateCalendar() {
            const calendar = document.getElementById('calendar');
            const today = new Date();
            const startDate = new Date(today.getFullYear(), today.getMonth(), 1);
            const endDate = new Date(today.getFullYear(), today.getMonth() + 1, 0);
            
            // Group articles by date
            const articlesByDate = {};
            allArticles.forEach(article => {
                if (article.time_published) {
                    const date = article.time_published.substring(0, 8);
                    if (!articlesByDate[date]) articlesByDate[date] = 0;
                    articlesByDate[date]++;
                }
            });
            
            // Generate calendar HTML
            let calendarHTML = '';
            
            // Day headers
            ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(day => {
                calendarHTML += `<div class="text-center font-bold p-2">${day}</div>`;
            });
            
            // Empty cells for start of month
            for (let i = 0; i < startDate.getDay(); i++) {
                calendarHTML += '<div class="p-2"></div>';
            }
            
            // Calendar days
            for (let day = 1; day <= endDate.getDate(); day++) {
                const date = `${today.getFullYear()}${String(today.getMonth() + 1).padStart(2, '0')}${String(day).padStart(2, '0')}`;
                const articleCount = articlesByDate[date] || 0;
                const hasNews = articleCount > 0;
                
                calendarHTML += `
                    <div class="calendar-day p-2 text-center rounded-lg cursor-pointer ${hasNews ? 'has-news' : ''}" 
                         onclick="filterByDate('${date}')">
                        <div class="font-bold">${day}</div>
                        ${hasNews ? `<div class="text-xs opacity-80">${articleCount}</div>` : ''}
                    </div>
                `;
            }
            
            calendar.innerHTML = calendarHTML;
        }

        // Update charts
        function updateCharts() {
            const tickerCounts = {};
            const sentimentCounts = {};
            
            filteredArticles.forEach(article => {
                const ticker = article.source_ticker || 'Unknown';
                const sentiment = article.overall_sentiment_label || 'Unknown';
                
                tickerCounts[ticker] = (tickerCounts[ticker] || 0) + 1;
                sentimentCounts[sentiment] = (sentimentCounts[sentiment] || 0) + 1;
            });
            
            // Update ticker chart
            tickerChart.data.labels = Object.keys(tickerCounts);
            tickerChart.data.datasets[0].data = Object.values(tickerCounts);
            tickerChart.update();
            
            // Update sentiment chart
            sentimentChart.data.labels = Object.keys(sentimentCounts);
            sentimentChart.data.datasets[0].data = Object.values(sentimentCounts);
            sentimentChart.update();
        }

        // Update news list
        function updateNewsList() {
            const container = document.getElementById('newsList');
            const showingCount = filteredArticles.length;
            const totalCount = allArticles.length;
            
            document.getElementById('showingCount').textContent = showingCount;
            document.getElementById('totalCount').textContent = totalCount;
            
            if (filteredArticles.length === 0) {
                container.innerHTML = '<div class="text-center opacity-60">No articles match your filters</div>';
                return;
            }
            
            container.innerHTML = filteredArticles.map(article => `
                <div class="news-item border-b border-gray-600 pb-4 last:border-b-0">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <div class="font-semibold text-blue-300">${article.title}</div>
                            <div class="text-sm opacity-80 mt-1">${article.summary}</div>
                            <div class="flex gap-4 mt-2 text-xs">
                                <span class="bg-blue-500 px-2 py-1 rounded">${article.source_ticker}</span>
                                <span class="bg-green-500 px-2 py-1 rounded">${article.overall_sentiment_label}</span>
                                <span class="opacity-60">${article.source}</span>
                                <span class="opacity-60">${article.time_published?.substring(0, 8) || 'N/A'}</span>
                            </div>
                        </div>
                        <div class="text-right text-xs opacity-60 ml-4">
                            ${article.overall_sentiment_score ? `Score: ${article.overall_sentiment_score.toFixed(3)}` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Apply filters
        function applyFilters() {
            const tickerFilter = document.getElementById('tickerFilter').value;
            const sentimentFilter = document.getElementById('sentimentFilter').value;
            const sourceFilter = document.getElementById('sourceFilter').value;
            const dateFilter = document.getElementById('dateFilter').value;
            
            filteredArticles = allArticles.filter(article => {
                if (tickerFilter && article.source_ticker !== tickerFilter) return false;
                if (sentimentFilter && article.overall_sentiment_label !== sentimentFilter) return false;
                if (sourceFilter && article.source !== sourceFilter) return false;
                if (dateFilter) {
                    const articleDate = article.time_published?.substring(0, 8);
                    const filterDate = dateFilter.replace(/-/g, '');
                    if (articleDate !== filterDate) return false;
                }
                return true;
            });
            
            updateCharts();
            updateNewsList();
        }

        // Filter by date (from calendar)
        function filterByDate(date) {
            document.getElementById('dateFilter').value = date.substring(0, 4) + '-' + date.substring(4, 6) + '-' + date.substring(6, 8);
            applyFilters();
        }

        // Clear all filters
        function clearFilters() {
            document.getElementById('tickerFilter').value = '';
            document.getElementById('sentimentFilter').value = '';
            document.getElementById('sourceFilter').value = '';
            document.getElementById('dateFilter').value = '';
            applyFilters();
        }

        // Event listeners
        document.getElementById('tickerFilter').addEventListener('change', applyFilters);
        document.getElementById('sentimentFilter').addEventListener('change', applyFilters);
        document.getElementById('sourceFilter').addEventListener('change', applyFilters);
        document.getElementById('dateFilter').addEventListener('change', applyFilters);
        document.getElementById('clearFilters').addEventListener('click', clearFilters);

        // Initialize
        initCharts();
        loadAllData();
    </script>
</body>
</html>
