version: '3.8'

services:
  coordinator:
    build: .
    volumes:
      - ../output/processed:/app/input:ro
      - ../output/scraped:/app/output
    command: python scrape_coordinator.py input/tickers.csv output --nodes 10
    environment:
      - PYTHONUNBUFFERED=1

  scraper-node1:
    build: .
    volumes:
      - ../output/processed:/app/input:ro
      - ../output/scraped:/app/output
    command: sh -c "sleep 10 && python scrape.py --node-id node1"
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - coordinator

  scraper-node2:
