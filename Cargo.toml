[package]
name = "dollar-punk"
version = "0.1.0"
edition = "2021"

[dependencies]
# GUI Framework
eframe = "0.32"
egui = "0.32"
egui_plot = "0.33"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }

# Alpha Vantage API
alpha_vantage = "0.1"

# HTML parsing
scraper = "0.18"
html5ever = "0.26"

# Data structures and serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Async runtime
futures = "0.3"

# URL handling
url = "2.4"

# Text processing
regex = "1.0"

# Configuration
config = "0.13"
dotenv = "0.15"

# CSV export
csv = "1.3"

# Random sampling
rand = "0.8"

# Twitter API (simulated)
oauth2 = "4.4"

# RSS feed parsing
feed-rs = "1.3"

# Natural language processing
whatlang = "0.16"

# Database for caching
rusqlite = { version = "0.29", features = ["bundled"] }

[[bin]]
name = "dollar-punk"
path = "src/main.rs"

[[example]]
name = "alpha_vantage_example"
path = "examples/alpha_vantage_example.rs"

[[example]]
name = "alpha_vantage_demo"
path = "examples/alpha_vantage_demo.rs"

[[example]]
name = "alpha_vantage_data_collection"
path = "examples/alpha_vantage_data_collection.rs"
